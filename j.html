<style>
:root {
    --paper: #FFF6EC;
    --card: #FFFFFF;
    --ink: #171216;
    --ink-soft: #7A6E72;
    --line: #EFE4D8;
    --accent: #FF5A1F;
    --ombre: 0 1px 2px rgba(23, 18, 22, 0.04), 0 8px 24px rgba(23, 18, 22, 0.06);
}

@media (prefers-color-scheme: dark) {
    :root {
        --paper: #121014;
        --card: #1E1B22;
        --ink: #FDF6EE;
        --ink-soft: #9C9199;
        --line: #2C2731;
        --accent: #FF7A45;
        --ombre: none;
    }
}

* { box-sizing: border-box; }

body {
    margin: 0;
    padding: 40px 20px 48px;
    background: var(--paper);
    color: var(--ink);
    /* La police arrondie du système sur iPhone : la même que l'app. */
    font: 16px/1.5 ui-rounded, -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-align: center;
}

main { max-width: 26rem; margin: 0 auto; }

.logo { width: 76px; height: 76px; border-radius: 18px; display: block; margin: 0 auto; }

h1 {
    font-size: 1.9rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1.15;
    margin: 22px 0 0;
}

.sous { color: var(--ink-soft); margin: 10px 0 0; }

/* --- Le code : lisible, copiable, mais pas le sujet ---------------------- */

.code {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin: 26px 0 0;
    padding: 12px 18px;
    background: var(--card);
    border-radius: 14px;
    box-shadow: var(--ombre);
    font-size: 1.35rem;
    font-weight: 800;
    letter-spacing: 0.16em;
    cursor: pointer;
    border: 0;
    color: inherit;
    font-family: inherit;
}
/* `display` posé par une classe l'emporte sur l'attribut `hidden` du
   navigateur : sans cette ligne, le bloc du code s'affichait vide quand le
   lien n'en portait pas. */
.code[hidden] { display: none; }

.code small {
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 0;
    color: var(--ink-soft);
}

/* --- L'action : une seule, celle qui correspond au téléphone ------------- */

.action {
    display: block;
    margin: 30px 0 0;
    padding: 17px 20px;
    font-size: 1.05rem;
    font-weight: 800;
    color: #fff;
    background: var(--accent);
    border-radius: 16px;
    text-decoration: none;
    transition: transform 0.12s ease;
}
.action:active { transform: scale(0.985); }

.autre {
    display: inline-block;
    margin-top: 18px;
    color: var(--ink-soft);
    font-size: 0.92rem;
}
.autre a { color: var(--ink-soft); }

.quoi {
    margin: 38px 0 0;
    padding-top: 26px;
    border-top: 1px solid var(--line);
    color: var(--ink-soft);
    font-size: 0.95rem;
}

footer { margin-top: 26px; color: var(--ink-soft); font-size: 0.85rem; }
footer a { color: var(--ink-soft); }
</style>

<h1>On t'attend dans la team</h1>
<p class="sous" id="sous">Une date, une team, et une petite séance jusqu'au départ.</p>

<button class="code" id="code" type="button" hidden>
    <span id="code-valeur">······</span><small id="code-etat">copier</small>
</button>

<!-- L'action principale et l'alternative sont écrites par le script : elles
     dépendent du téléphone. Poser les trois choix côte à côte obligeait
     l'arrivant à se reconnaître dans l'un d'eux avant de pouvoir agir. -->
<div id="choix"></div>

<p class="quoi">Chacun coche sa séance, tout le monde voit qui suit. Rien d'autre.</p>

<footer>
    <a href="index.html">En savoir plus</a> ·
    <a href="confidentialite.html">Confidentialité</a> ·
    <a href="mentions-legales.html">Mentions légales</a>
</footer>

</main>

<script>
// Le code arrive de deux façons : ?c=K7RXP4, ou une adresse de la forme
// .../j/K7RXP4 relayée par la page 404 de GitHub Pages.
(function () {
    var APP_STORE = "https://apps.apple.com/app/id6803060278";

    var params = new URLSearchParams(location.search);
    var code = (params.get("c") || "").toUpperCase();
    var choix = document.getElementById("choix");

    if (!/^[ABCDEFGHJKLMNPQRSTUVWXYZ23456789]{6}$/.test(code)) {
        document.getElementById("sous").textContent =
            "Ce lien n'a pas de code de team. Demande à ton pote de te renvoyer son invitation.";
        return;
    }

    // Le code, montré et copiable — il sert à qui tape à la main, ou à qui
    // ouvre le lien sur un ordinateur et continue sur son téléphone.
    var bouton = document.getElementById("code");
    var etat = document.getElementById("code-etat");
    document.getElementById("code-valeur").textContent = code;
    bouton.hidden = false;
    bouton.addEventListener("click", function () {
        navigator.clipboard && navigator.clipboard.writeText(code).then(function () {
            etat.textContent = "copié";
            setTimeout(function () { etat.textContent = "copier"; }, 1800);
        });
    });

    // Un seul bouton, celui qui a une chance de marcher ici. L'App Store sur
    // un Android, ou « ouvrir dans l'app » sur un ordinateur, ne sont pas des
    // choix : ce sont des impasses présentées comme des options.
    var ua = navigator.userAgent || "";
    var iOS = /iPhone|iPad|iPod/.test(ua)
        || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
    var web = "team.html?c=" + code;

    if (iOS) {
        choix.innerHTML =
            '<a class="action" href="lineup://join/' + code + '">Ouvrir dans Line-up</a>' +
            '<p class="autre"><a href="' + APP_STORE + '">Installer l\'app</a>' +
            ' &middot; <a id="web" href="' + web + '">continuer sans</a></p>';
    } else {
        // Android, ordinateur : l'app n'existe pas ici, la page web est la
        // seule vraie porte d'entrée. On ne la présente donc pas comme un
        // repli, mais comme le chemin normal.
        choix.innerHTML =
            '<a class="action" id="web" href="' + web + '">Rejoindre la team</a>' +
            '<span class="autre">Line-up est une app iPhone — ici, tu suis la team depuis ton navigateur.</span>';
    }
})();
</script>
