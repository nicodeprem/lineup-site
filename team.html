<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Line-up — la team</title>
<meta name="description" content="Suis la préparation de ta team, même sans iPhone.">
<meta name="robots" content="noindex">
<meta property="og:title" content="Rejoins la team sur Line-up">
<meta property="og:description" content="Une date, une team, et une petite séance jusqu'au départ.">
<meta property="og:image" content="https://nicodeprem.github.io/lineup-site/apercu.png">
<meta property="og:type" content="website">
<style>
:root {
    --paper: #FFF6EC;
    --card: #FFFFFF;
    --ink: #171216;
    --ink-soft: #7A6E72;
    --line: #E6DACE;
    --accent: #FF5A1F;
    --done: #18A558;
}

@media (prefers-color-scheme: dark) {
    :root {
        --paper: #121014;
        --card: #1E1B22;
        --ink: #FDF6EE;
        --ink-soft: #9C9199;
        --line: #322C36;
        --accent: #FF7A45;
        --done: #33D17A;
    }
}

* { box-sizing: border-box; }

body {
    margin: 0;
    padding: 24px 18px 64px;
    background: var(--paper);
    color: var(--ink);
    font: 17px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

main { max-width: 34rem; margin: 0 auto; }

.card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 20px;
    margin: 16px 0;
}

.entete { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.nom { color: var(--accent); font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; font-size: 1.1rem; }
.jours { font-size: 2.6rem; font-weight: 800; letter-spacing: -0.03em; line-height: 1; white-space: nowrap; }
.date-depart { color: var(--ink-soft); font-size: 0.92rem; margin-top: 2px; }

.titre-bloc {
    font-size: 0.78rem; font-weight: 800; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--ink-soft); margin: 0 0 14px;
}

.mouvement { display: flex; gap: 12px; align-items: baseline; padding: 11px 0; border-top: 1px solid var(--line); }
.mouvement:first-of-type { border-top: 0; }
.mouvement .texte { flex: 1; min-width: 0; }
.mouvement .titre { font-weight: 700; }
.mouvement .but { color: var(--ink-soft); font-size: 0.86rem; }
.mouvement .comment { color: var(--ink-soft); font-size: 0.86rem; margin-top: 3px; }
.mouvement .volume { font-weight: 800; white-space: nowrap; }

.materiel { color: var(--ink-soft); font-size: 0.9rem; margin: 14px 0 0; }

button.principal {
    display: block; width: 100%; margin-top: 18px; padding: 15px 18px;
    font: inherit; font-weight: 800; color: #fff; background: var(--accent);
    border: 0; border-radius: 16px; cursor: pointer;
}
button.principal[disabled] { opacity: 0.55; cursor: default; }
button.principal.fait { background: var(--done); }

table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
th { color: var(--ink-soft); font-weight: 700; font-size: 0.74rem; padding: 0 4px 8px; white-space: nowrap; }
td { padding: 5px 4px; }
td.qui { display: flex; align-items: center; gap: 8px; font-weight: 700; }
.pastille { width: 11px; height: 11px; border-radius: 50%; flex: none; }
.case { width: 26px; height: 26px; border-radius: 8px; border: 2px dashed var(--line); margin: 0 auto; }
.case.ok { border: 0; background: var(--done); position: relative; }
.case.ok::after {
    content: ""; position: absolute; left: 8px; top: 4px; width: 6px; height: 12px;
    border: solid #fff; border-width: 0 2.5px 2.5px 0; transform: rotate(45deg);
}
.defilant { overflow-x: auto; }
.moi { color: var(--ink-soft); font-weight: 500; font-size: 0.8rem; }

label { display: block; font-weight: 700; margin: 14px 0 6px; }
input[type=text] {
    width: 100%; padding: 13px 14px; font: inherit;
    background: var(--paper); color: var(--ink);
    border: 1px solid var(--line); border-radius: 14px;
}
.couleurs { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }
.couleurs button {
    width: 38px; height: 38px; border-radius: 50%; border: 3px solid transparent;
    cursor: pointer; padding: 0;
}
.couleurs button[aria-pressed="true"] { border-color: var(--ink); }
.couleurs button[disabled] { opacity: 0.25; cursor: default; }

.souple { color: var(--ink-soft); }
.erreur { color: var(--accent); font-weight: 700; }
.centre { text-align: center; }

footer { margin-top: 34px; color: var(--ink-soft); font-size: 0.85rem; text-align: center; }
footer a { color: var(--ink-soft); }

.encart {
    margin-top: 26px; padding: 16px 18px; border: 1px dashed var(--line);
    border-radius: 16px; color: var(--ink-soft); font-size: 0.9rem;
}
.encart a { color: var(--accent); font-weight: 700; }
</style>
</head>
<body>
<main id="app">
    <p class="centre souple">Un instant…</p>
</main>

<footer>
    <a href="index.html">Line-up</a> ·
    <a href="confidentialite.html">Confidentialité</a>
</footer>

<script type="module">
// ---------------------------------------------------------------------------
// La page pour les potes sans iPhone.
//
// Elle ne calcule rien du programme : elle lit des séances déjà écrites par
// l'app de celui qui a lancé le trip. Tout ce qui décide — la courbe de
// charge, le choix des mouvements — reste dans l'app, et n'est jamais envoyé
// ici.
//
// La clé ci-dessous est la clé « publishable », faite pour être publique :
// c'est la Row Level Security de Supabase qui protège les données, pas le
// secret de cette clé. Elle est déjà embarquée dans l'app iPhone.
// ---------------------------------------------------------------------------
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const SUPABASE_URL = "https://zaufzgjfnnayeimoyjgn.supabase.co";
const SUPABASE_KEY = "sb_publishable_kLQyh4cgQG0YLIHmHfqGgg_KlHVJerX";

const COULEURS = ["#FF5A1F", "#0A84FF", "#18A558", "#E8308A", "#7B3FE4",
                  "#FFB400", "#00B3A6", "#E5484D", "#5B8C00", "#FF7AB6"];

const app = document.getElementById("app");
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

// L'état, relu à chaque fois qu'on touche quelque chose.
let code = null;
let groupe = null;
let membres = [];
let checkins = [];
let seances = [];
let moi = null;

// --- Petits outils ---------------------------------------------------------

const jourLocal = (d) => {
    const p = (n) => String(n).padStart(2, "0");
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
};

const aujourdhui = () => jourLocal(new Date());

/// Le nombre de jours qui restent, calculé sur des dates nues : passer par des
/// heures ferait sauter un jour au changement d'heure.
function joursAvant(iso) {
    const [a, m, j] = iso.split("-").map(Number);
    const cible = new Date(a, m - 1, j);
    const maintenant = new Date();
    const debut = new Date(maintenant.getFullYear(), maintenant.getMonth(), maintenant.getDate());
    return Math.round((cible - debut) / 86400000);
}

function dateEnToutesLettres(iso) {
    const [a, m, j] = iso.split("-").map(Number);
    return new Date(a, m - 1, j).toLocaleDateString("fr-FR",
        { weekday: "long", day: "numeric", month: "long" });
}

const echapper = (s) => String(s ?? "").replace(/[&<>"']/g,
    (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/// Les messages du serveur arrivent en code court : on les traduit ici, comme
/// l'app le fait de son côté.
function messageErreur(e) {
    const t = (e && (e.message || e.hint || "")) + "";
    if (t.includes("code_inconnu")) return "Ce code ne correspond à aucune team.";
    if (t.includes("trip_termine")) return "Ce trip est déjà passé — trop tard pour le rejoindre.";
    if (t.includes("groupe_complet")) return "Cette team est complète. Demande à celui qui l'a lancée d'ouvrir une place.";
    return "Ça n'a pas marché. Réessaie dans un instant.";
}

// --- Chargement ------------------------------------------------------------

async function connexion() {
    const { data } = await db.auth.getSession();
    if (!data.session) await db.auth.signInAnonymously();
}

/// Tout ce que la page affiche, en quatre lectures. La RLS fait le tri : on
/// ne reçoit que les teams dont on est membre.
async function charger() {
    const { data: groupes } = await db.from("groups")
        .select("id, code, event_name, event_date, cadence, sport")
        .eq("code", code);
    groupe = (groupes && groupes[0]) || null;
    if (!groupe) { membres = []; return; }

    const [m, c, s, u] = await Promise.all([
        db.from("members").select("id, name, color, is_owner, joined_at, auth_uid")
          .eq("group_id", groupe.id).order("joined_at"),
        db.from("checkins").select("member_id, session_index"),
        db.from("plan_sessions").select("session_index, day, minutes, gear, movements")
          .eq("group_id", groupe.id).order("session_index"),
        db.auth.getUser()
    ]);

    membres = m.data || [];
    checkins = c.data || [];
    seances = s.data || [];
    const monId = u.data && u.data.user ? u.data.user.id : null;
    moi = membres.find((x) => x.auth_uid === monId) || null;
}

// --- Les écrans ------------------------------------------------------------

function ecranCodeManquant() {
    app.innerHTML = `
        <h1>Line-up</h1>
        <p>Ce lien n'a pas de code de team. Demande à ton pote de te renvoyer
        son lien d'invitation.</p>`;
}

/// Pas encore membre : le prénom et la couleur, comme dans l'app.
function ecranArrivee(erreur) {
    const prises = new Set(membres.map((m) => m.color.toUpperCase()));
    const libres = COULEURS.filter((c) => !prises.has(c));
    const choisie = libres[0] || COULEURS[0];

    app.innerHTML = `
        <h1>On t'attend dans la team</h1>
        <p class="souple">Code <strong>${echapper(code)}</strong>. Pas d'app à
        installer, pas de compte à créer.</p>
        <div class="card">
            <label for="prenom">Et toi, c'est ?</label>
            <input type="text" id="prenom" placeholder="Ton prénom" maxlength="20"
                   autocomplete="given-name">
            <label>Ta couleur</label>
            <div class="couleurs" id="couleurs">
                ${COULEURS.map((c) => `
                    <button style="background:${c}" data-couleur="${c}"
                        aria-pressed="${c === choisie}"
                        ${prises.has(c) ? "disabled" : ""}
                        aria-label="Couleur ${c}"></button>`).join("")}
            </div>
            ${erreur ? `<p class="erreur">${echapper(erreur)}</p>` : ""}
            <button class="principal" id="rejoindre">Rejoindre la team</button>
        </div>
        <div class="encart">
            Tu es sur iPhone ? <a href="https://apps.apple.com/app/id6803060278">Installe
            plutôt l'app</a> : tu auras les séances guidées et les rappels.
        </div>`;

    let couleur = choisie;
    const grille = document.getElementById("couleurs");
    grille.addEventListener("click", (e) => {
        const b = e.target.closest("button[data-couleur]");
        if (!b || b.disabled) return;
        couleur = b.dataset.couleur;
        grille.querySelectorAll("button").forEach((x) =>
            x.setAttribute("aria-pressed", x === b));
    });

    const bouton = document.getElementById("rejoindre");
    bouton.addEventListener("click", async () => {
        const prenom = document.getElementById("prenom").value.trim();
        if (!prenom) { document.getElementById("prenom").focus(); return; }
        bouton.disabled = true;
        bouton.textContent = "On arrive…";
        const { error } = await db.rpc("join_group",
            { p_code: code, p_name: prenom, p_color: couleur });
        if (error) { ecranArrivee(messageErreur(error)); return; }
        await charger();
        rendre();
    });
}

function blocSeance() {
    const jour = aujourdhui();
    const seance = seances.find((s) => s.day === jour);

    if (!seance) {
        const prochaine = seances.find((s) => s.day > jour);
        return `<div class="card">
            <p class="titre-bloc">Aujourd'hui</p>
            <p style="margin:0;font-weight:700">Rien aujourd'hui</p>
            <p class="souple" style="margin:6px 0 0">${
                prochaine
                    ? `Prochaine séance ${echapper(dateEnToutesLettres(prochaine.day))}.`
                    : "Le plan est bouclé. Il ne reste plus qu'à y aller."
            }</p>
        </div>`;
    }

    const fait = moi && checkins.some(
        (c) => c.member_id === moi.id && c.session_index === seance.session_index);

    const mouvements = (seance.movements || []).map((m) => `
        <div class="mouvement">
            <div class="texte">
                <div class="titre">${echapper(m.name)}</div>
                <div class="but">${echapper(m.purpose)}</div>
                <div class="comment">${echapper(m.cue)}</div>
            </div>
            <div class="volume">${echapper(m.volume)}</div>
        </div>`).join("");

    return `<div class="card">
        <div class="entete" style="margin-bottom:14px">
            <p class="titre-bloc" style="margin:0">Séance ${seance.session_index + 1} / ${seances.length}</p>
            <span class="souple">≈ ${seance.minutes} min</span>
        </div>
        ${mouvements}
        ${seance.gear ? `<p class="materiel">✋ ${echapper(seance.gear)}</p>` : ""}
        <button class="principal ${fait ? "fait" : ""}" id="cocher"
                data-seance="${seance.session_index}" data-fait="${fait}">
            ${fait ? "C'est fait ✓" : "J'ai fait ma séance"}
        </button>
    </div>`;
}

function blocTeam() {
    const jour = aujourdhui();
    const passees = seances.filter((s) => s.day <= jour);
    const colonnes = passees.slice(-6);

    const lignes = membres.map((m) => `
        <tr>
            <td class="qui">
                <span class="pastille" style="background:${echapper(m.color)}"></span>
                ${echapper(m.name)}${moi && m.id === moi.id ? ' <span class="moi">toi</span>' : ""}
            </td>
            ${colonnes.map((s) => {
                const ok = checkins.some(
                    (c) => c.member_id === m.id && c.session_index === s.session_index);
                return `<td><div class="case ${ok ? "ok" : ""}"></div></td>`;
            }).join("")}
        </tr>`).join("");

    return `<div class="card">
        <p class="titre-bloc">La team</p>
        <div class="defilant">
            <table>
                <thead><tr><th></th>${colonnes.map((s) => {
                    const [, m, j] = s.day.split("-");
                    return `<th>${j}/${m}</th>`;
                }).join("")}</tr></thead>
                <tbody>${lignes}</tbody>
            </table>
        </div>
        ${colonnes.length === 0
            ? '<p class="souple" style="margin:10px 0 0">La première séance n\'est pas encore passée.</p>'
            : ""}
    </div>`;
}

function ecranTeam() {
    const jours = joursAvant(groupe.event_date);

    app.innerHTML = `
        <div class="entete">
            <div>
                <div class="nom">${echapper(groupe.event_name)}</div>
                <div class="date-depart">${echapper(dateEnToutesLettres(groupe.event_date))}</div>
            </div>
            <div class="jours">${jours > 0 ? "J-" + jours : jours === 0 ? "Jour J" : "C'est passé"}</div>
        </div>

        ${jours > 0 ? blocSeance() : `<div class="card">
            <p class="titre-bloc">Ça y est</p>
            <p style="margin:0;font-weight:700">Vous y êtes</p>
            <p class="souple" style="margin:6px 0 0">La prépa est derrière vous.</p>
        </div>`}

        ${blocTeam()}

        ${seances.length === 0 ? `<div class="encart">
            Les séances n'apparaîtront ici qu'une fois que celui qui a lancé le
            trip aura rouvert l'app sur son iPhone. En attendant, tu peux déjà
            suivre la team.
        </div>` : ""}

        <div class="encart">
            Cette page est la version courte, pour ceux qui n'ont pas d'iPhone.
            <a href="https://apps.apple.com/app/id6803060278">L'app</a> ajoute la
            séance guidée et les rappels.
        </div>`;

    const bouton = document.getElementById("cocher");
    if (bouton) bouton.addEventListener("click", () => cocher(bouton));
}

/// Cocher, ou décocher si on s'est trompé. On repart d'une lecture complète :
/// c'est une action rare, autant rester exact plutôt que rapide.
async function cocher(bouton) {
    if (!moi) return;
    const index = Number(bouton.dataset.seance);
    const dejaFait = bouton.dataset.fait === "true";
    bouton.disabled = true;
    bouton.textContent = "…";

    const requete = dejaFait
        ? db.from("checkins").delete().eq("member_id", moi.id).eq("session_index", index)
        : db.from("checkins").insert({ member_id: moi.id, session_index: index });

    const { error } = await requete;
    if (error) {
        bouton.disabled = false;
        bouton.textContent = "Réessayer";
        return;
    }
    await charger();
    rendre();
}

function rendre() {
    if (!groupe || !moi) ecranArrivee();
    else ecranTeam();
}

// --- Départ ----------------------------------------------------------------

(async function () {
    const params = new URLSearchParams(location.search);
    code = (params.get("c") || "").toUpperCase();
    if (!/^[ABCDEFGHJKLMNPQRSTUVWXYZ23456789]{6}$/.test(code)) return ecranCodeManquant();

    try {
        await connexion();
        await charger();
        rendre();
    } catch (e) {
        app.innerHTML = `<p class="erreur">Connexion impossible pour l'instant.
            Réessaie dans un moment.</p>`;
    }
})();
</script>
</body>
</html>
