<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Line-up — la team</title>
<meta name="description" content="Suis la préparation de ta team, même sans iPhone.">
<meta name="robots" content="noindex">
<meta property="og:title" content="Rejoins la team sur Line-up">
<meta property="og:description" content="Une date, une team, et une petite séance jusqu'au départ.">
<meta property="og:image" content="https://nicodeprem.github.io/lineup-site/apercu.png">
<meta property="og:type" content="website">

<!-- Posable sur l'écran d'accueil, où la page s'ouvre en plein écran et
     retrouve sa team. C'est fait pour Android, à qui cette page s'adresse.

     `apple-mobile-web-app-capable` est volontairement absent. Sur iPhone, il
     ferait s'ouvrir la page dans un rangement séparé de Safari : l'identité
     anonyme et le code de la team n'y seraient pas, l'arrivant se croirait
     inconnu et rejoindrait une deuxième fois — en consommant une place de la
     team. Sans lui, l'icône rouvre simplement Safari, qui se souvient. Un
     iPhone n'a de toute façon pas besoin de cette page : il a l'app. -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#FFF6EC">
<link rel="apple-touch-icon" href="icone-192.png">
<link rel="icon" href="icone-192.png">
<style>
:root {
    --paper: #FFF6EC;
    --card: #FFFFFF;
    --ink: #171216;
    --ink-soft: #7A6E72;
    --line: #EFE4D8;
    --accent: #FF5A1F;
    --done: #18A558;
    --ombre: 0 1px 2px rgba(23, 18, 22, 0.04), 0 8px 24px rgba(23, 18, 22, 0.06);
}

@media (prefers-color-scheme: dark) {
    :root {
        --paper: #121014;
        --card: #1E1B22;
        --ink: #FDF6EE;
        --ink-soft: #9C9199;
        --line: #2C2731;
        --accent: #FF7A45;
        --done: #33D17A;
        --ombre: none;
    }
}

* { box-sizing: border-box; }

body {
    margin: 0;
    padding: 30px 20px 48px;
    background: var(--paper);
    color: var(--ink);
    /* ui-rounded donne la police arrondie d'Apple sur iPhone, la même que
       l'app. Ailleurs, la police système habituelle. */
    font: 16px/1.5 ui-rounded, -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
}

main { max-width: 30rem; margin: 0 auto; }

/* --- Le haut : ce qu'on regarde en premier ------------------------------- */

.trip {
    color: var(--accent);
    font-weight: 800;
    font-size: 0.8rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    margin: 0;
}

.compte {
    font-size: 4.2rem;
    font-weight: 800;
    letter-spacing: -0.04em;
    line-height: 0.95;
    margin: 8px 0 0;
}
.compte.court { font-size: 2.6rem; letter-spacing: -0.02em; }

.depart {
    color: var(--ink-soft);
    margin: 8px 0 0;
    font-size: 0.95rem;
}

/* --- Les blocs ----------------------------------------------------------- */

.bloc {
    background: var(--card);
    border-radius: 22px;
    padding: 22px;
    margin-top: 26px;
    box-shadow: var(--ombre);
}

.chapeau {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 18px;
}

.chapeau h2 {
    font-size: 0.76rem;
    font-weight: 800;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin: 0;
}

.duree { color: var(--ink-soft); font-size: 0.88rem; font-variant-numeric: tabular-nums; }

/* --- La séance : deux lignes par mouvement, pas trois -------------------- */

.mvt { padding: 14px 0; border-top: 1px solid var(--line); }
.mvt:first-of-type { padding-top: 0; border-top: 0; }

.mvt .haut {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 14px;
}

.mvt .nom { font-weight: 700; font-size: 1.02rem; }

.mvt .volume {
    font-weight: 800;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
}

.mvt .comment {
    color: var(--ink-soft);
    font-size: 0.88rem;
    margin-top: 3px;
    padding-right: 4rem;
}

.materiel {
    color: var(--ink-soft);
    font-size: 0.88rem;
    margin: 4px 0 0;
    padding-top: 16px;
    border-top: 1px solid var(--line);
}

/* --- Le bouton ----------------------------------------------------------- */

.action {
    display: block;
    width: 100%;
    margin-top: 20px;
    padding: 17px 18px;
    font: inherit;
    font-size: 1.05rem;
    font-weight: 800;
    color: #fff;
    background: var(--accent);
    border: 0;
    border-radius: 16px;
    cursor: pointer;
    transition: transform 0.12s ease, opacity 0.12s ease;
}
.action:active { transform: scale(0.985); }
.action[disabled] { opacity: 0.5; cursor: default; }
.action.fait { background: var(--done); }

/* --- La team ------------------------------------------------------------- */

.equipier {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 0;
    border-top: 1px solid var(--line);
}
.equipier:first-of-type { padding-top: 0; border-top: 0; }

.pastille { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.equipier .qui { font-weight: 700; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.equipier .moi { color: var(--ink-soft); font-weight: 500; font-size: 0.82rem; }

.suite { display: flex; gap: 7px; flex: none; }
.point {
    width: 15px; height: 15px; border-radius: 50%;
    background: var(--line);
}
.point.ok { background: var(--done); }

/* --- L'arrivée ----------------------------------------------------------- */

h1 { font-size: 1.75rem; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 8px; }

.intro { color: var(--ink-soft); margin: 0 0 4px; }

label { display: block; font-weight: 700; margin: 0 0 8px; font-size: 0.95rem; }
/* Le deuxième intitulé suit un champ, pas un intitulé : sans ça il se collait
   sous la case du prénom. */
.bloc input + label { margin-top: 24px; }

input[type=text] {
    width: 100%;
    padding: 15px 16px;
    font: inherit;
    background: var(--paper);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 14px;
}
input[type=text]:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }

.couleurs { display: flex; flex-wrap: wrap; gap: 12px; }
.couleurs button {
    width: 36px; height: 36px; border-radius: 50%;
    border: 0; padding: 0; cursor: pointer;
    box-shadow: 0 0 0 0 var(--ink);
    transition: box-shadow 0.12s ease;
}
.couleurs button[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--card), 0 0 0 5px var(--ink); }
.couleurs button[disabled] { opacity: 0.2; cursor: default; }

/* --- Le reste ------------------------------------------------------------ */

.souple { color: var(--ink-soft); }
.erreur { color: var(--accent); font-weight: 700; margin: 16px 0 0; }
.centre { text-align: center; }
.grand { font-size: 1.15rem; font-weight: 700; margin: 0; }
.bloc .grand + p { margin: 6px 0 0; }

.rappel {
    margin-top: 26px;
    padding: 14px 16px;
    border: 1px dashed var(--line);
    border-radius: 16px;
    color: var(--ink-soft);
    font-size: 0.88rem;
    display: flex;
    align-items: center;
    gap: 12px;
}
.rappel button {
    flex: none;
    background: none;
    border: 0;
    padding: 4px;
    color: var(--ink-soft);
    font: inherit;
    font-size: 1.1rem;
    cursor: pointer;
    line-height: 1;
}

.pied {
    margin-top: 30px;
    text-align: center;
    color: var(--ink-soft);
    font-size: 0.85rem;
    line-height: 1.6;
}
.pied a { color: var(--ink-soft); }
.pied .app { color: var(--accent); font-weight: 700; text-decoration: none; }
</style>
</head>
<body>
<main id="app">
    <p class="centre souple">Un instant…</p>
</main>

<script type="module">
// ---------------------------------------------------------------------------
// La page pour les potes sans iPhone.
//
// Elle ne calcule rien du programme : elle lit des séances déjà écrites par
// l'app de celui qui a lancé le trip. Tout ce qui décide — la courbe de
// charge, le choix des mouvements — reste dans l'app, et n'est jamais envoyé
// ici.
//
// La clé ci-dessous est la clé « publishable », faite pour être publique :
// c'est la Row Level Security de Supabase qui protège les données, pas le
// secret de cette clé. Elle est déjà embarquée dans l'app iPhone.
// ---------------------------------------------------------------------------
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const SUPABASE_URL = "https://zaufzgjfnnayeimoyjgn.supabase.co";
const SUPABASE_KEY = "sb_publishable_kLQyh4cgQG0YLIHmHfqGgg_KlHVJerX";
const APP_STORE = "https://apps.apple.com/app/id6803060278";

const COULEURS = ["#FF5A1F", "#0A84FF", "#18A558", "#E8308A", "#7B3FE4",
                  "#FFB400", "#00B3A6", "#E5484D", "#5B8C00", "#FF7AB6"];

/// Combien de séances passées la bande garde sous les yeux. Au-delà, la ligne
/// déborde sur un téléphone étroit — et personne ne remonte à trois semaines.
const COLONNES = 5;

const app = document.getElementById("app");
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

let code = null;
let groupe = null;
let membres = [];
let checkins = [];
let seances = [];
let moi = null;

// --- Petits outils ---------------------------------------------------------

const jourLocal = (d) => {
    const p = (n) => String(n).padStart(2, "0");
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
};

const aujourdhui = () => jourLocal(new Date());

/// Le nombre de jours qui restent, calculé sur des dates nues : passer par des
/// heures ferait sauter un jour au changement d'heure.
function joursAvant(iso) {
    const [a, m, j] = iso.split("-").map(Number);
    const cible = new Date(a, m - 1, j);
    const maintenant = new Date();
    const debut = new Date(maintenant.getFullYear(), maintenant.getMonth(), maintenant.getDate());
    return Math.round((cible - debut) / 86400000);
}

function dateEnToutesLettres(iso) {
    const [a, m, j] = iso.split("-").map(Number);
    return new Date(a, m - 1, j).toLocaleDateString("fr-FR",
        { weekday: "long", day: "numeric", month: "long" });
}

/// « demain », « lundi », ou une date — comme le dirait quelqu'un à l'oral.
function quand(iso) {
    const dans = joursAvant(iso);
    if (dans === 1) return "demain";
    if (dans > 1 && dans < 7) {
        const [a, m, j] = iso.split("-").map(Number);
        return new Date(a, m - 1, j).toLocaleDateString("fr-FR", { weekday: "long" });
    }
    return dateEnToutesLettres(iso);
}

const echapper = (s) => String(s ?? "").replace(/[&<>"']/g,
    (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/// Les messages du serveur arrivent en code court : on les traduit ici, comme
/// l'app le fait de son côté.
function messageErreur(e) {
    const t = (e && (e.message || e.hint || "")) + "";
    if (t.includes("code_inconnu")) return "Ce code ne correspond à aucune team.";
    if (t.includes("trip_termine")) return "Ce trip est déjà passé — trop tard pour le rejoindre.";
    if (t.includes("groupe_complet")) return "Cette team est complète. Demande à celui qui l'a lancée d'ouvrir une place.";
    return "Ça n'a pas marché. Réessaie dans un instant.";
}

// --- Chargement ------------------------------------------------------------

async function connexion() {
    const { data } = await db.auth.getSession();
    if (!data.session) await db.auth.signInAnonymously();
}

/// Tout ce que la page affiche, en quatre lectures. La RLS fait le tri : on
/// ne reçoit que les teams dont on est membre.
async function charger() {
    const { data: groupes } = await db.from("groups")
        .select("id, code, event_name, event_date, cadence, sport")
        .eq("code", code);
    groupe = (groupes && groupes[0]) || null;
    if (!groupe) { membres = []; return; }

    const [m, c, s, u] = await Promise.all([
        db.from("members").select("id, name, color, is_owner, joined_at, auth_uid")
          .eq("group_id", groupe.id).order("joined_at"),
        db.from("checkins").select("member_id, session_index"),
        db.from("plan_sessions").select("session_index, day, minutes, gear, movements")
          .eq("group_id", groupe.id).order("session_index"),
        db.auth.getUser()
    ]);

    membres = m.data || [];
    checkins = c.data || [];
    seances = s.data || [];
    const monId = u.data && u.data.user ? u.data.user.id : null;
    moi = membres.find((x) => x.auth_uid === monId) || null;
}

// --- Les écrans ------------------------------------------------------------

const pied = (texte) => `<p class="pied">${texte}</p>`;

function ecranCodeManquant() {
    app.innerHTML = `
        <h1>Line-up</h1>
        <p class="intro">Ce lien n'a pas de code de team. Demande à ton pote de
        te renvoyer son lien d'invitation.</p>`;
}

/// Pas encore membre : le prénom et la couleur, rien d'autre.
function ecranArrivee(erreur) {
    // Avant d'être dans la team, on n'en voit aucun membre : c'est la RLS qui
    // le veut, et c'est bien. Impossible, donc, de savoir quelles couleurs
    // sont déjà prises — proposer systématiquement la première de la palette
    // ferait arriver tout le monde en orange. On en tire une au hasard, et
    // celui qui arrive la change s'il veut.
    const prises = new Set(membres.map((m) => m.color.toUpperCase()));
    const libres = COULEURS.filter((c) => !prises.has(c));
    const choisie = libres.length
        ? libres[Math.floor(Math.random() * libres.length)]
        : COULEURS[0];

    app.innerHTML = `
        <h1>On t'attend dans la team</h1>
        <p class="intro">Code ${echapper(code)}. Rien à installer.</p>

        <div class="bloc">
            <label for="prenom">Et toi, c'est ?</label>
            <input type="text" id="prenom" placeholder="Ton prénom" maxlength="20"
                   autocomplete="given-name" enterkeyhint="go">

            <label>Ta couleur</label>
            <div class="couleurs" id="couleurs">
                ${COULEURS.map((c) => `
                    <button style="background:${c}" data-couleur="${c}"
                        aria-pressed="${c === choisie}"
                        ${prises.has(c) ? "disabled" : ""}
                        aria-label="Couleur ${c}"></button>`).join("")}
            </div>

            ${erreur ? `<p class="erreur">${echapper(erreur)}</p>` : ""}
            <button class="action" id="rejoindre">Rejoindre la team</button>
        </div>

        ${pied(`Sur iPhone ? <a class="app" href="${APP_STORE}">Prends plutôt l'app.</a>`)}`;

    let couleur = choisie;
    const grille = document.getElementById("couleurs");
    grille.addEventListener("click", (e) => {
        const b = e.target.closest("button[data-couleur]");
        if (!b || b.disabled) return;
        couleur = b.dataset.couleur;
        grille.querySelectorAll("button").forEach((x) =>
            x.setAttribute("aria-pressed", x === b));
    });

    const bouton = document.getElementById("rejoindre");
    const champ = document.getElementById("prenom");
    champ.addEventListener("keydown", (e) => { if (e.key === "Enter") bouton.click(); });

    bouton.addEventListener("click", async () => {
        const prenom = champ.value.trim();
        if (!prenom) { champ.focus(); return; }
        bouton.disabled = true;
        bouton.textContent = "On arrive…";
        const { error } = await db.rpc("join_group",
            { p_code: code, p_name: prenom, p_color: couleur });
        if (error) { ecranArrivee(messageErreur(error)); return; }
        await charger();
        rendre();
    });
}

function blocSeance() {
    const jour = aujourdhui();
    const seance = seances.find((s) => s.day === jour);

    if (!seance) {
        const prochaine = seances.find((s) => s.day > jour);
        return `<div class="bloc">
            <p class="grand">Rien aujourd'hui</p>
            <p class="souple">${
                prochaine
                    ? `Prochaine séance ${echapper(quand(prochaine.day))}.`
                    : "Le plan est bouclé. Il ne reste plus qu'à y aller."
            }</p>
        </div>`;
    }

    const fait = moi && checkins.some(
        (c) => c.member_id === moi.id && c.session_index === seance.session_index);

    // Deux lignes par mouvement : ce qu'on fait, et comment. Le « à quoi ça
    // sert » a été retiré — trois lignes par mouvement, ça se lit comme un
    // formulaire, plus comme une séance.
    const mouvements = (seance.movements || []).map((m) => `
        <div class="mvt">
            <div class="haut">
                <span class="nom">${echapper(m.name)}</span>
                <span class="volume">${echapper(m.volume)}</span>
            </div>
            <div class="comment">${echapper(m.cue)}</div>
        </div>`).join("");

    return `<div class="bloc">
        <div class="chapeau">
            <h2>Aujourd'hui</h2>
            <span class="duree">${seance.minutes} min</span>
        </div>
        ${mouvements}
        ${seance.gear ? `<p class="materiel">${echapper(seance.gear)}</p>` : ""}
        <button class="action ${fait ? "fait" : ""}" id="cocher"
                data-seance="${seance.session_index}" data-fait="${fait}">
            ${fait ? "C'est fait ✓" : "J'ai fait ma séance"}
        </button>
    </div>`;
}

function blocTeam() {
    const jour = aujourdhui();
    const colonnes = seances.filter((s) => s.day <= jour).slice(-COLONNES);

    const lignes = membres.map((m) => `
        <div class="equipier">
            <span class="pastille" style="background:${echapper(m.color)}"></span>
            <span class="qui">${echapper(m.name)}${
                moi && m.id === moi.id ? ' <span class="moi">toi</span>' : ""}</span>
            <span class="suite">${colonnes.map((s) => {
                const ok = checkins.some(
                    (c) => c.member_id === m.id && c.session_index === s.session_index);
                return `<span class="point ${ok ? "ok" : ""}"></span>`;
            }).join("")}</span>
        </div>`).join("");

    return `<div class="bloc">
        <div class="chapeau"><h2>La team</h2></div>
        ${lignes}
        ${colonnes.length === 0
            ? '<p class="souple" style="margin:12px 0 0">La première séance n\'est pas encore passée.</p>'
            : ""}
    </div>`;
}

function ecranTeam() {
    const jours = joursAvant(groupe.event_date);
    const fini = jours <= 0;

    app.innerHTML = `
        <p class="trip">${echapper(groupe.event_name)}</p>
        <p class="compte${fini ? " court" : ""}">${
            jours > 0 ? "J-" + jours : jours === 0 ? "C'est aujourd'hui" : "C'est passé"}</p>
        <p class="depart">${echapper(dateEnToutesLettres(groupe.event_date))}</p>

        ${fini
            ? `<div class="bloc">
                   <p class="grand">Vous y êtes</p>
                   <p class="souple">La prépa est derrière vous.</p>
               </div>`
            : seances.length === 0
                ? `<div class="bloc">
                       <p class="grand">Les séances arrivent</p>
                       <p class="souple">Elles apparaîtront dès que celui qui a lancé
                       le trip aura rouvert l'app sur son iPhone.</p>
                   </div>`
                : blocSeance()}

        ${blocTeam()}

        ${rappelEcranAccueil()}

        ${pied(`Séance guidée et rappels : <a class="app" href="${APP_STORE}">dans l'app</a>.<br>
                <a href="index.html">Line-up</a> · <a href="confidentialite.html">Confidentialité</a>`)}`;

    const bouton = document.getElementById("cocher");
    if (bouton) bouton.addEventListener("click", () => cocher(bouton));

    const non = document.getElementById("rappel-non");
    if (non) non.addEventListener("click", () => {
        memoire.ecrire("lineup.rappel", "non");
        document.getElementById("rappel").remove();
    });
}

/// Cocher, ou décocher si on s'est trompé. On repart d'une lecture complète :
/// c'est une action rare, autant rester exact plutôt que rapide.
async function cocher(bouton) {
    if (!moi) return;
    const index = Number(bouton.dataset.seance);
    const dejaFait = bouton.dataset.fait === "true";
    bouton.disabled = true;
    bouton.textContent = "…";

    const requete = dejaFait
        ? db.from("checkins").delete().eq("member_id", moi.id).eq("session_index", index)
        : db.from("checkins").insert({ member_id: moi.id, session_index: index });

    const { error } = await requete;
    if (error) {
        bouton.disabled = false;
        bouton.textContent = "Réessayer";
        return;
    }
    await charger();
    rendre();
}

function rendre() {
    if (!groupe || !moi) ecranArrivee();
    else ecranTeam();
}

// --- Départ ----------------------------------------------------------------

const VALIDE = /^[ABCDEFGHJKLMNPQRSTUVWXYZ23456789]{6}$/;

/// Ce qu'on garde dans le navigateur, et pourquoi c'est peu : les données
/// vivent sur le serveur. Ici, seulement de quoi retrouver sa team au
/// prochain passage.
const memoire = {
    lire(cle) { try { return localStorage.getItem(cle); } catch (e) { return null; } },
    ecrire(cle, valeur) { try { localStorage.setItem(cle, valeur); } catch (e) {} }
};

/// Demande au navigateur de ne pas effacer ces données pour faire de la
/// place. Il répond ce qu'il veut — c'est une demande, pas un ordre.
async function garderLesDonnees() {
    try {
        if (navigator.storage && navigator.storage.persist) await navigator.storage.persist();
    } catch (e) {}
}

/// Posée sur l'écran d'accueil, la page se lance sans le `?c=CODE` du lien
/// d'invitation. Sans ce repli, l'icône tomberait sur « code manquant ».
function codeDeDepart() {
    const params = new URLSearchParams(location.search);
    const recu = (params.get("c") || "").toUpperCase();
    if (VALIDE.test(recu)) {
        memoire.ecrire("lineup.code", recu);
        return recu;
    }
    const retenu = (memoire.lire("lineup.code") || "").toUpperCase();
    return VALIDE.test(retenu) ? retenu : "";
}

/// L'invite à poser la page sur l'écran d'accueil. Discrète, une seule fois,
/// et jamais pour qui l'a déjà fait.
function rappelEcranAccueil() {
    const debout = window.matchMedia("(display-mode: standalone)").matches
        || window.navigator.standalone === true;
    if (debout || memoire.lire("lineup.rappel") === "non") return "";

    // Android seulement : voir le commentaire de l'en-tête. Sur iPhone, poser
    // la page sur l'écran d'accueil ferait plus de mal que de bien.
    const ua = navigator.userAgent || "";
    if (!/Android/.test(ua)) return "";

    return `<div class="rappel" id="rappel">
        <span>Pour revenir sans rechercher le lien : le menu du navigateur,
        puis « Ajouter à l'écran d'accueil ».</span>
        <button type="button" id="rappel-non" aria-label="Ne plus afficher">&times;</button>
    </div>`;
}

(async function () {
    code = codeDeDepart();
    if (!code) return ecranCodeManquant();

    try {
        await connexion();
        await charger();
        rendre();
        garderLesDonnees();
    } catch (e) {
        app.innerHTML = `<p class="erreur centre">Connexion impossible pour l'instant.
            Réessaie dans un moment.</p>`;
    }
})();
